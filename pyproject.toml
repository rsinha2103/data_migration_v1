[project]
name = "data-migration-concept"
version = "0.1.0"
description = "Open source data migration workbench: extract, transform, validate, load and reconcile."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "polars>=1.0",
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "sqlglot>=25.0",
    "openpyxl>=3.1",
    "fastapi>=0.161.0",
    "uvicorn[standard]>=0.54.0",
    "python-multipart>=0.0.32",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.scripts]
dmc = "data_migration_concept.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
    "psycopg[binary]>=3.1",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_migration_concept"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
"src/data_migration_concept/report/html.py" = ["E501"]  # HTML template
"src/data_migration_concept/ui/app.py" = ["E501", "B008"]  # FastAPI Form()/File() defaults
"src/data_migration_concept/proposals/*.py" = ["E501"]  # hand-aligned tables and entries
"tests/*.py" = ["E501"]  # long literal test data

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: needs a running PostgreSQL (docker compose up -d db)"]

[tool.mypy]
python_version = "3.12"
strict = false
ignore_missing_imports = true
files = ["src"]
